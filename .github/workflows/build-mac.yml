name: Build macOS Standalone App (.dmg)

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  build-macos:
    name: Build PicClip Studio for macOS (Apple Silicon M1/M2/M3/M4 & Intel)
    runs-on: macos-14 # Apple Silicon M1 Runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          brew install ffmpeg create-dmg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview

      - name: Build Next.js Static Export
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Compile macOS Application with PyInstaller
        run: |
          python build_mac_app.py

      - name: Create Native Apple Disk Image (.dmg)
        run: |
          mkdir -p dmg_assets
          # Build Drag-and-Drop installer dmg
          hdiutil create -volname "PicClip Studio" -srcfolder "dist/PicClipStudio" -ov -format UDZO "PicClipStudio-macOS.dmg"
          zip -r "PicClipStudio-macOS.zip" "dist/PicClipStudio"

      - name: Upload macOS Artifacts (.dmg and .zip)
        uses: actions/upload-artifact@v4
        with:
          name: PicClipStudio-macOS-AppleSilicon
          path: |
            PicClipStudio-macOS.dmg
            PicClipStudio-macOS.zip
          retention-days: 14
