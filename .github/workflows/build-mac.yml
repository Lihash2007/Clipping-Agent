name: Build macOS Standalone App (.dmg)

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  build-macos:
    name: Build PicClip Studio for macOS (Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview

      - name: Compile macOS Application with PyInstaller & Build DMG
        run: |
          python build_mac_app.py

      - name: Upload macOS Artifacts (.dmg and .zip)
        uses: actions/upload-artifact@v4
        with:
          name: PicClipStudio-macOS-AppleSilicon
          path: |
            PicClipStudio-macOS.dmg
            PicClipStudio-macOS.zip
          retention-days: 14
